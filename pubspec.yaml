name: flutter_api_contract
description: >-
  Catch drift between your Dart/Flutter models and the backend's OpenAPI or
  Swagger schema before it crashes in production.
version: 0.1.0
repository: https://github.com/youssef336/flutter_api_contract
issue_tracker: https://github.com/youssef336/flutter_api_contract/issues
topics: [openapi, swagger, json, lint, cli]

environment:
  sdk: ^3.11.0

executables:
  api_contract:

dependencies:
  analyzer: ^14.5.0
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0
